    <svg id="screen" width="712" height="1088" viewBox="0 0 712 1088" preserveAspectRatio="xMidYMin slice">
    <rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="48" font-weight="bold" class="color10">Usage:</text><text x="48" textLength="8" class="foreground"> </text><text x="56" textLength="32" font-weight="bold" class="color14">socx</text><text x="88" textLength="8" class="foreground"> </text><text x="96" textLength="256" class="color6">[options] &lt;subcommand&gt; [args]...</text><text x="352" textLength="360" class="foreground">                                             </text></g><g id="g2"><text x="0" textLength="712" class="foreground">                                                                                         </text></g><g id="g3"><text x="0" textLength="712" class="foreground">System on chip verification and tooling infrastructure.                                  </text></g><g id="g4"><text x="0" textLength="128" font-weight="bold" class="color10">General Options:</text><text x="128" textLength="584" class="color2">                                                                         </text></g><g id="g5"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="16" font-weight="bold" class="color14">-h</text><text x="32" textLength="16" class="foreground">, </text><text x="48" textLength="48" font-weight="bold" class="color14">--help</text><text x="96" textLength="608" class="foreground">          Show this message and exit.                                       </text><text x="704" textLength="8" class="color2"> </text></g><g id="g6"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="16" font-weight="bold" class="color14">-d</text><text x="32" textLength="16" class="foreground">, </text><text x="48" textLength="56" font-weight="bold" class="color14">--debug</text><text x="104" textLength="600" class="foreground">         Enable debug mode and logging.                                    </text><text x="704" textLength="8" class="color2"> </text></g><g id="g7"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="168" class="foreground">                     </text><text x="176" textLength="528" class="color3">[ENV=SOCX_DEBUG]                                                  </text><text x="704" textLength="8" class="color2"> </text></g><g id="g8"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="16" font-weight="bold" class="color14">-v</text><text x="32" textLength="16" class="foreground">, </text><text x="48" textLength="88" font-weight="bold" class="color14">--verbosity</text><text x="136" textLength="568" class="foreground">     set the logging verbosity to the specified level.                 </text><text x="704" textLength="8" class="color2"> </text></g><g id="g9"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="168" class="foreground">                     </text><text x="176" textLength="528" class="color6">&lt;notset|debug|info|warn|warning|error|fatal|critical&gt;             </text><text x="704" textLength="8" class="color2"> </text></g><g id="g10"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="168" class="foreground">                     </text><text x="176" textLength="528" class="color3">[ENV=SOCX_VERBOSITY]                                              </text><text x="704" textLength="8" class="color2"> </text></g><g id="g11"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="56" font-weight="bold" class="color14">--color</text><text x="72" textLength="8" class="foreground">/</text><text x="80" textLength="80" font-weight="bold" class="color14">--no-color</text><text x="160" textLength="544" class="foreground">  Enable/disable colored output.                                    </text><text x="704" textLength="8" class="color2"> </text></g><g id="g12"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="168" class="foreground">                     </text><text x="176" textLength="528" class="color3">[ENV=SOCX_COLOR]                                                  </text><text x="704" textLength="8" class="color2"> </text></g><g id="g13"><text x="0" textLength="712" class="color2">                                                                                         </text></g><g id="g14"><text x="0" textLength="128" font-weight="bold" class="color10">Project Options:</text><text x="128" textLength="584" class="color2">                                                                         </text></g><g id="g15"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="24" font-weight="bold" class="color14">-cd</text><text x="40" textLength="16" class="foreground">, </text><text x="56" textLength="40" font-weight="bold" class="color14">--cwd</text><text x="96" textLength="608" class="foreground">                           Run the command from another directory           </text><text x="704" textLength="8" class="color2"> </text></g><g id="g16"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="304" class="foreground">                                      </text><text x="312" textLength="392" class="color6">&lt;directory&gt;                                      </text><text x="704" textLength="8" class="color2"> </text></g><g id="g17"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="16" font-weight="bold" class="color14">-f</text><text x="32" textLength="16" class="foreground">, </text><text x="48" textLength="104" font-weight="bold" class="color14">--config-file</text><text x="152" textLength="552" class="foreground">                    Additional configuration file(s) to load. Can be </text><text x="704" textLength="8" class="color2"> </text></g><g id="g18"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="696" class="foreground">                                      passed multiple times to load multiple files.    </text><text x="704" textLength="8" class="color2"> </text></g><g id="g19"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="304" class="foreground">                                      </text><text x="312" textLength="392" class="color6">&lt;path&gt;                                           </text><text x="704" textLength="8" class="color2"> </text></g><g id="g20"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="16" font-weight="bold" class="color14">-C</text><text x="32" textLength="16" class="foreground">, </text><text x="48" textLength="88" font-weight="bold" class="color14">--configure</text><text x="136" textLength="8" class="foreground">/</text><text x="144" textLength="24" font-weight="bold" class="color14">-NC</text><text x="168" textLength="16" class="foreground">, </text><text x="184" textLength="112" font-weight="bold" class="color14">--no-configure</text><text x="296" textLength="408" class="foreground">  Enable/disable loading of user and local         </text><text x="704" textLength="8" class="color2"> </text></g><g id="g21"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="696" class="foreground">                                      configuration files.                             </text><text x="704" textLength="8" class="color2"> </text></g><g id="g22"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="304" class="foreground">                                      </text><text x="312" textLength="392" class="color3">[ENV=SOCX_CONFIGURE]                             </text><text x="704" textLength="8" class="color2"> </text></g><g id="g23"><text x="0" textLength="72" font-weight="bold" class="color10">Commands:</text><text x="72" textLength="640" class="color2">                                                                                </text></g><g id="g24"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="88" font-weight="bold" class="color14">git        </text><text x="104" textLength="40" class="foreground"> Run </text><text x="144" textLength="24" font-weight="bold" class="color14">git</text><text x="168" textLength="536" class="foreground"> commands in parallel on multiple repositories.                    </text><text x="704" textLength="8" class="color2"> </text></g><g id="g25"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="88" font-weight="bold" class="color14">init       </text><text x="104" textLength="112" class="foreground"> Initialize a </text><text x="216" textLength="32" font-weight="bold" class="color14">socx</text><text x="248" textLength="456" class="foreground"> project at the current directory.                       </text><text x="704" textLength="8" class="color2"> </text></g><g id="g26"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="88" font-weight="bold" class="color14">plugin     </text><text x="104" textLength="600" class="foreground"> Add, create, inspect, and manage extension plugins.                       </text><text x="704" textLength="8" class="color2"> </text></g><g id="g27"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="88" font-weight="bold" class="color14">config     </text><text x="104" textLength="600" class="foreground"> Get, set, list, or modify settings configuration values.                  </text><text x="704" textLength="8" class="color2"> </text></g><g id="g28"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="88" font-weight="bold" class="color14">version    </text><text x="104" textLength="600" class="foreground"> Print version information and exit.                                       </text><text x="704" textLength="8" class="color2"> </text></g><g id="g29"><text x="0" textLength="8" class="color2"> </text><text x="8" textLength="8" class="foreground"> </text><text x="16" textLength="88" font-weight="bold" class="color14">regression </text><text x="104" textLength="600" class="foreground"> Perform various regression related actions.                               </text><text x="704" textLength="8" class="color2"> </text></g><g id="g30"><text x="0" textLength="40" class="foreground">  &#128191; </text><text x="40" textLength="24" font-weight="bold" class="color11">Cwd</text><text x="64" textLength="576" class="foreground">:                                                                       </text></g><g id="g31"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="392" font-style="italic" class="color5">/home/skimhi/.project/git/users/sagikimhi/python/</text><text x="408" textLength="64" font-style="italic" class="color13">socx-cli</text><text x="472" textLength="96" class="foreground">            </text></g><g id="g32"><text x="0" textLength="40" class="foreground">  &#128194; </text><text x="40" textLength="32" font-weight="bold" class="color11">Root</text><text x="72" textLength="568" class="foreground">:                                                                      </text></g><g id="g33"><text x="0" textLength="40" class="foreground">  &#128295; </text><text x="40" textLength="48" font-weight="bold" class="color11">Config</text><text x="88" textLength="16" class="foreground">: </text><text x="104" textLength="72" font-style="