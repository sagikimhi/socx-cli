regression:
  # test class to create when loading regressions from a file
  test_cls: "socx:Test"

  # regression class to create when loading regressions from a file
  regression_cls: "socx:Regression"

  # stored state file format, can be any of: yaml/toml/json
  state_format: yaml

  # limits the maximum number of tests that can be in "running" state at any
  # given time.
  max_runs_in_parallel: 10

  # settings for the `socx regression run` command
  run:
    input:
      filename: ~
      directory: ~
    output:
      directory: "@path workrun/regression"

  # settings for the `socx regression tui` command
  tui:
    # TUI related filesystem paths
    paths:
      # path to socx_tui package directory
      app_dir: >-
        @jinja {{'{}/../socx_tui'.format(this.paths.app_root_dir) | realpath}}
      # path to socx_tui static files directory
      static_dir: >-
        @jinja {{'{}/static'.format(this.regression.tui.paths.app_dir) | realpath}}
      # path to socx_tui static 'tcss' directory
      tcss_dir: >-
        @jinja {{'{}/tcss/regression'.format(this.regression.tui.paths.static_dir) | realpath}}

    # TUI application theme
    theme: atom-one-dark

    # TUI application settings
    app:
      run:
        inline: false
        inline_no_clear: true
      css_path: >-
        @jinja {{this.regression.tui.paths.tcss_dir}}/app.tcss

    details:
      help: |
        # Regression TUI (Terminal-User-Interface)

        ## Quick Start

        Use `o` or `ctrl+o` key to load a regression from a file.

        A regression may be loaded by either one of the supported file formats
        listed below:
        - TOML (`.toml`)
        - YAML (`.yaml`, `.yml`)
        - JSON/JSONC/JSON5 (`.json`, `.jsonc`, `.json5`)
        - Python (`.py`)

        ## Example (YAML):

        ```yaml
        # file: foo.yml
        foo_regression:
          - name: foo_test
            exec: my_custom_run_script --test foo_test

          - name: bar_test
            exec:
              - my_custom_pre_run_script --name bar --build-image
              - my_custom_run_script --image bar.img --test bar_test
              - my_custom_post_run_script --rerun-if-failed --rerun-flags=--debug,--verbose bar_test

          - name: bazz_test
            exec: |
              #!/usr/bin/env python3

              from my_package.runners import MyRunner

              my_custom_runner = MyRunner()
              my_custom_runner.run("/path/to/bazz_test.cfg")

        ```

    # TUI application per-widget keybindings
    keybinds:
      SoCX:
        - key: "?"
          show: true
          action: toggle_help_panel()
          description: Toggle help
        - key: f1
          show: false
          action: toggle_help_panel()
          description: Toggle help
        - key: f2
          show: false
          action: toggle_dark()
          description: Switch between light/dark theme modes
        - key: "!"
          show: false
          action: toggle_maximize()
          description: Maxmimize/minimize the focused widget

      RegressionWidget:
        # Hidden Keys
        - key: o
          show: false
          action: load_regression_from_file
          description: Load regressions from file
        - key: X
          show: false
          action: stop_selected
          description: Stop regression/test
        - key: x
          show: false
          action: pause_selected
          description: Pause regression/test

        # Shown Keys
        - key: ctrl+o
          show: true
          action: load_regression_from_file
          description: Open file
        - key: R
          show: true
          action: prompt_restart_selected
          description: Restart
        - key: P
          show: true
          action: stop_selected
          description: Stop
        - key: p
          show: true
          action: pause_selected
          description: Pause
        - key: r
          show: true
          action: resume_selected
          description: Resume
        - key: s
          show: true
          action: start_selected
          description: Start

      TestOutputDialog:
        - key: escape
          show: true
          action: dismiss(None)
          description: Dismiss the dialog.
        - key: q
          show: true
          action: dismiss(None)
          description: Dismiss the dialog.
